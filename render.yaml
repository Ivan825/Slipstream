# Render blueprint: one web service runs the API, the sockets, the simulator and the dashboard.
# Full steps: docs/DEPLOY.md. You are asked for MONGO_URI, CLIENT_ORIGIN and (optionally) OPENF1_TOKEN.
services:
  - type: web
    name: slipstream
    runtime: node
    plan: free
    buildCommand: npm ci && VITE_API_URL= npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INGEST_SECRET
        generateValue: true
      - key: SERVE_CLIENT
        value: "true"
      - key: EMBED_SIMULATOR
        value: "true"
      # your Vercel URL (and this Render URL), comma separated; set after the first deploy
      - key: CLIENT_ORIGIN
        sync: false
      # scripted race storyline so the hosted demo always has something happening
      - key: DEMO_DIRECTOR
        value: "true"
      # pre-download the first minutes of a real session on first boot (any other session streams on demand)
      - key: REPLAY_AUTO_IMPORT
        value: "true"
      - key: REPLAY_SESSION
        value: "9636"
      # optional: OpenF1 subscription key for the live feed
      - key: OPENF1_TOKEN
        sync: false
      # keeps the raw telemetry of a free-tier Atlas cluster (512 MB) well under its limit
      - key: TELEMETRY_TTL_MIN
        value: "10"
